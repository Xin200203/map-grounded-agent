seed: 1
auto_gpu_config: 1
num_processes: 1
num_eval_episodes: 1
num_training_frames: 10000000
num_global_steps: 20
num_local_steps: 25
num_sem_categories: 7
num_training_frames: 10000000
num_processes_on_first_gpu: 1
num_processes_per_gpu: 1
sim_gpu_id: 0
sem_gpu_id: 0
policy_gpu_id: 0
backbone_2d: rednet
deactivate_klmap: false

env_frame_width: 640
env_frame_height: 480
frame_width: 160
frame_height: 120
max_episode_length: 500
task_config: "tasks/instance_imagenav_hm3d.yaml"
split: "val"
camera_height: 0.88
hfov: 79.0
turn_angle: 30
min_depth: 0.5
max_depth: 5.0
success_dist: 1.0
floor_thr: 50
min_d: 1.5
max_d: 100.0
version: "v1.1"

agent: "sem_exp"
lr: 1e-5
global_hidden_size: 256
eps: 1e-5
alpha: 0.99
gamma: 0.99
use_gae: false
tau: 0.95
entropy_coef: 0.001
value_loss_coef: 0.5
max_grad_norm: 0.5
num_global_steps_wait: 20
ppo_epoch: 4
num_mini_batch: 2
clip_param: 0.2
use_recurrent_global: 0
reward_coeff: 0.1
intrinsic_rew_coeff: 0.0
num_eval_episodes: 1
eval: 1
collision_threshold: 0.20
seg_threshold: 0.9
ignore_object_by_detector: 0

visualize: 0
print_images: 0
vis_type: 1
save_pictures: 0
dump_location: "./outputs/experiments/"
exp_name: "exp1"
save_periodic: 500000
load: "0"

map_size_cm: 4800
map_resolution: 5
global_downscaling: 2
vision_range: 100
obstacle_boundary: 5
du_scale: 1
map_pred_threshold: 1.0
exp_pred_threshold: 1.0
collision_threshold: 0.20

llm_model: "claude-haiku-4-5-20251001"
llm_model_fast: "claude-haiku-4-5-20251001"
vlm_model: "claude-haiku-4-5-20251001"
api_key_env: "SMOOTHNAV_API_KEY"
base_url_env: "SMOOTHNAV_BASE_URL"
api_provider: "anthropic"
api_protocol: "anthropic-messages"

controller_profile: "smoothnav-full"
controller_enable_monitor: true
controller_monitor_policy: "llm_escalation"
controller_enable_prefetch: true
controller_replan_policy: "event"
controller_enable_stuck_replan: true
controller_stuck_suppression_steps: 8
controller_direction_reuse_limit: 1
controller_grounding_noop_replan_threshold: 2
controller_same_frontier_reuse_threshold: 2
controller_fixed_plan_interval_steps: 40
controller_prefetch_near_threshold: 10.0
graph_frontier_min_size: 20
graph_goal_distance_threshold: 1.2
graph_allow_raw_frontier_fallback: true
graph_allow_relaxed_distance_fallback: true
graph_semantic_bias_weight: 4.0
graph_bias_candidate_topk: 24
graph_bias_candidate_radius: 8.0
graph_goal_topk: 5
graph_frontier_novelty_weight: 1.0
graph_frontier_unknown_radius: 6
graph_local_actionability_weight: 2.0
graph_filter_local_actionable_frontiers: true
graph_relax_bias_for_local_actionability: true
graph_frontier_repeat_penalty: 2.0
graph_frontier_recent_penalty: 1.0
graph_recent_frontier_window: 8
graph_enable_direct_object_goal: false
graph_text_goal_use_frontier_anchor: true
graph_text_goal_allow_local_direct_object_goal: true
graph_text_goal_direct_relevance_threshold: 0.75
graph_text_goal_nonlocal_object_as_search_anchor: true
